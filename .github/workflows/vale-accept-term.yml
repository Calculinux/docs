name: Vale - Add Term to Accept List

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-to-accept-list:
    # Only run on PR comments (both issue comments and review comments)
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for vale-accept-term command
        id: check-command
        uses: actions/github-script@v7
        with:
          script: |
            // Determine event type and extract comment body
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            const commentBody = context.payload.comment.body.trim();
            const commentLower = commentBody.toLowerCase();
            const validCommand = 'vale-accept-term';
            
            // Extract issue/PR number based on event type
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            core.setOutput('issue_number', issueNumber);
            
            // Check if comment starts with the valid command
            if (!commentLower.startsWith(validCommand)) {
              console.log('Comment does not start with vale-accept-term command:', commentLower);
              return { shouldRun: false };
            }
            
            // Check if a custom term was provided after the command
            // Format: "vale-accept-term CustomTerm" or "vale-accept-term (?i)pattern"
            const customTerm = commentBody.substring(validCommand.length).trim();
            const hasCustomTerm = customTerm.length > 0;
            
            if (hasCustomTerm) {
              console.log('Custom term provided:', customTerm);
            }
            
            let term = null;
            
            if (hasCustomTerm) {
              // Use the custom term provided in the command
              term = customTerm;
              console.log('Using custom term:', term);
            } else {
              // Extract term from parent comment (original behavior)
              let previousComment;
              const currentCommentId = context.payload.comment.id;
              
              if (isReviewComment) {
                // For review comments, use in_reply_to_id to find the parent comment
                const inReplyToId = context.payload.comment.in_reply_to_id;
                
                if (!inReplyToId) {
                  console.log('Review comment is not a reply to another comment');
                  return { shouldRun: false };
                }
                
                // Fetch the parent comment directly
                try {
                  const parentComment = await github.rest.pulls.getReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: inReplyToId
                  });
                  previousComment = parentComment.data;
                } catch (error) {
                  console.log('Could not fetch parent review comment:', error.message);
                  return { shouldRun: false };
                }
              } else {
                // For issue comments, get the list and find the previous one
                const issueComments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                const comments = issueComments.data;
                const currentIndex = comments.findIndex(c => c.id === currentCommentId);
                
                if (currentIndex <= 0) {
                  console.log('No previous comment found');
                  return { shouldRun: false };
                }
                
                previousComment = comments[currentIndex - 1];
              }
              
              // Check if it's a Vale error comment (from vale-action bot)
              if (!previousComment.body.includes('Vale') && !previousComment.body.includes('vale')) {
                console.log('Previous comment is not a Vale error');
                return { shouldRun: false };
              }
              
              // Extract term from Vale error message
              // Vale errors typically look like: "Did you really mean 'term'?"
              // or: "Unknown word: term"
              const termPatterns = [
                /'([^']+)'/,           // Single quotes
                /"([^"]+)"/,           // Double quotes
                /\*\*([^*]+)\*\*/,     // Bold markdown
                /`([^`]+)`/,           // Code backticks
                /Unknown word:\s*(\w+)/i,
                /Did you really mean\s+'([^']+)'/i
              ];
              
              for (const pattern of termPatterns) {
                const match = previousComment.body.match(pattern);
                if (match) {
                  term = match[1];
                  break;
                }
              }
              
              if (!term) {
                console.log('Could not extract term from Vale error');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: '❌ Could not extract term from the Vale error.\n\nPlease ensure you are replying to a Vale error comment with `vale-accept-term`, or provide the term explicitly like `vale-accept-term YourTerm`.'
                });
                return { shouldRun: false };
              }
              
              console.log('Extracted term from parent comment:', term);
            }
            core.setOutput('term', term);
            core.setOutput('should_run', 'true');
            core.setOutput('is_review_comment', isReviewComment ? 'true' : 'false');
            return { shouldRun: true, term: term };

      - name: Get PR details
        if: steps.check-command.outputs.should_run == 'true'
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber
            });
            core.setOutput('head_ref', pr.data.head.ref);
            return pr.data.head.ref;

      - name: Checkout PR branch
        if: steps.check-command.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-details.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add term to accept list
        if: steps.check-command.outputs.should_run == 'true'
        id: add-term
        run: |
          TERM="${{ steps.check-command.outputs.term }}"
          ACCEPT_FILE=".github/styles/config/vocabularies/Calculinux/accept.txt"
          
          if [ -z "$TERM" ]; then
            echo "No term to add"
            exit 1
          fi
          
          # Check if term already exists (case-insensitive)
          if grep -iq "^${TERM}$" "$ACCEPT_FILE"; then
            echo "term_exists=true" >> $GITHUB_OUTPUT
            echo "Term '$TERM' already exists in accept list"
          else
            # Add term to the end of the file (before any trailing newlines)
            # Remove trailing newlines, add term, add back one newline
            sed -i -e :a -e '/^\s*$/d;N;ba' "$ACCEPT_FILE"
            echo "$TERM" >> "$ACCEPT_FILE"
            echo "term_exists=false" >> $GITHUB_OUTPUT
            echo "Added term '$TERM' to accept list"
          fi

      - name: Commit and push changes
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists != 'true'
        run: |
          TERM="${{ steps.check-command.outputs.term }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .github/styles/config/vocabularies/Calculinux/accept.txt
          git commit -m "docs: add '$TERM' to Vale accept list
          
          Added via PR comment command.
          Co-authored-by: ${{ github.event.comment.user.login }} <${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com>"
          
          git push

      - name: Post success comment
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const term = '${{ steps.check-command.outputs.term }}';
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            
            // Helper function to resolve review thread
            async function resolveReviewThread() {
              try {
                const prNumber = issueNumber;
                
                // Query to get all review threads for the PR and find the one with our comment
                const query = `
                  query($owner: String!, $repo: String!, $prNumber: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $prNumber) {
                        reviewThreads(first: 100) {
                          nodes {
                            id
                            isResolved
                            comments(first: 50) {
                              nodes {
                                databaseId
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;
                
                const variables = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  prNumber: prNumber
                };
                
                const result = await github.graphql(query, variables);
                const threads = result.repository.pullRequest.reviewThreads.nodes;
                
                // Find the thread that contains our comment or its parent
                const commentId = context.payload.comment.id;
                const inReplyToId = context.payload.comment.in_reply_to_id;
                
                let threadId = null;
                for (const thread of threads) {
                  const commentIds = thread.comments.nodes.map(c => c.databaseId);
                  if (commentIds.includes(commentId) || (inReplyToId && commentIds.includes(inReplyToId))) {
                    threadId = thread.id;
                    console.log('Found thread ID:', threadId, 'isResolved:', thread.isResolved);
                    break;
                  }
                }
                
                if (threadId) {
                  // Resolve the thread using GraphQL mutation
                  const mutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: {threadId: $threadId}) {
                        thread {
                          id
                          isResolved
                        }
                      }
                    }
                  `;
                  
                  const resolveResult = await github.graphql(mutation, { threadId });
                  console.log('Thread resolved successfully:', resolveResult.resolveReviewThread.thread.isResolved);
                } else {
                  console.log('Could not find thread ID for comment', commentId);
                }
              } catch (error) {
                console.log('Could not resolve conversation thread:', error.message);
                console.log('Error details:', error);
                // Don't fail the workflow if we can't resolve the thread
              }
            }
            
            // Find or create the tracking comment
            const COMMENT_MARKER = '<!-- vale-accept-term-tracker -->';
            
            // Get all comments on the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            // Find existing tracking comment
            const existingComment = comments.find(comment => comment.body.includes(COMMENT_MARKER));
            
            if (existingComment) {
              // Update existing comment by adding the new term to the list
              const currentBody = existingComment.body;
              
              // Extract the list of terms from the current comment
              // Match lines that start with "- `term`"
              const termMatches = currentBody.match(/^- `([^`]+)`/gm) || [];
              const existingTerms = termMatches.map(m => m.match(/`([^`]+)`/)[1]);
              
              // Add the new term to the list if not already there
              if (!existingTerms.includes(term)) {
                existingTerms.push(term);
              }
              
              // Sort terms alphabetically
              existingTerms.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
              
              // Build the updated comment body
              const termsList = existingTerms.map(t => '- `' + t + '`').join('\n');
              const updatedBody = COMMENT_MARKER + '\n## ✅ Vale Terms Added to Accept List\n\n' +
                'The following terms have been added to the Vale accept list in this PR:\n\n' +
                termsList + '\n\n' +
                'These terms will no longer be flagged as errors by Vale.';
              
              // Update the comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: updatedBody
              });
              
              console.log('Updated existing tracking comment with term:', term);
            } else {
              // Create new tracking comment
              const newBody = COMMENT_MARKER + '\n## ✅ Vale Terms Added to Accept List\n\n' +
                'The following terms have been added to the Vale accept list in this PR:\n\n' +
                '- `' + term + '`\n\n' +
                'These terms will no longer be flagged as errors by Vale.';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              });
              
              console.log('Created new tracking comment with term:', term);
            }
            
            // Add green checkmark reaction to the command comment
            if (isReviewComment) {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            }
            
            // Try to resolve the review thread if this was a review comment
            if (isReviewComment) {
              await resolveReviewThread();
            }

      - name: Post already exists comment
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const term = '${{ steps.check-command.outputs.term }}';
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            
            // Helper function to resolve review thread
            async function resolveReviewThread() {
              try {
                const prNumber = issueNumber;
                
                // Query to get all review threads for the PR and find the one with our comment
                const query = `
                  query($owner: String!, $repo: String!, $prNumber: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $prNumber) {
                        reviewThreads(first: 100) {
                          nodes {
                            id
                            isResolved
                            comments(first: 50) {
                              nodes {
                                databaseId
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;
                
                const variables = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  prNumber: prNumber
                };
                
                const result = await github.graphql(query, variables);
                const threads = result.repository.pullRequest.reviewThreads.nodes;
                
                // Find the thread that contains our comment or its parent
                const commentId = context.payload.comment.id;
                const inReplyToId = context.payload.comment.in_reply_to_id;
                
                let threadId = null;
                for (const thread of threads) {
                  const commentIds = thread.comments.nodes.map(c => c.databaseId);
                  if (commentIds.includes(commentId) || (inReplyToId && commentIds.includes(inReplyToId))) {
                    threadId = thread.id;
                    console.log('Found thread ID:', threadId, 'isResolved:', thread.isResolved);
                    break;
                  }
                }
                
                if (threadId) {
                  // Resolve the thread using GraphQL mutation
                  const mutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: {threadId: $threadId}) {
                        thread {
                          id
                          isResolved
                        }
                      }
                    }
                  `;
                  
                  const resolveResult = await github.graphql(mutation, { threadId });
                  console.log('Thread resolved successfully:', resolveResult.resolveReviewThread.thread.isResolved);
                } else {
                  console.log('Could not find thread ID for comment', commentId);
                }
              } catch (error) {
                console.log('Could not resolve conversation thread:', error.message);
                console.log('Error details:', error);
                // Don't fail the workflow if we can't resolve the thread
              }
            }
            
            // For already existing terms, just add a reaction and resolve thread
            // No need to post a separate comment since the term is already accepted
            console.log('Term already exists in accept list - adding reaction only:', term);
            
            // Add reaction to the command comment
            if (isReviewComment) {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            }
            
            // Try to resolve the review thread if this was a review comment
            if (isReviewComment) {
              await resolveReviewThread();
            }
            
            // Try to resolve the review thread if this was a review comment
            if (isReviewComment) {
              try {
                // Get the thread ID from the comment
                // First, get the PR number
                const prNumber = issueNumber;
                
                // Query to get all review threads for the PR and find the one with our comment
                const query = `
                  query($owner: String!, $repo: String!, $prNumber: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $prNumber) {
                        reviewThreads(first: 100) {
                          nodes {
                            id
                            isResolved
                            comments(first: 50) {
                              nodes {
                                databaseId
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;
                
                const variables = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  prNumber: prNumber
                };
                
                const result = await github.graphql(query, variables);
                const threads = result.repository.pullRequest.reviewThreads.nodes;
                
                // Find the thread that contains our comment or its parent
                const commentId = context.payload.comment.id;
                const inReplyToId = context.payload.comment.in_reply_to_id;
                
                let threadId = null;
                for (const thread of threads) {
                  const commentIds = thread.comments.nodes.map(c => c.databaseId);
                  if (commentIds.includes(commentId) || (inReplyToId && commentIds.includes(inReplyToId))) {
                    threadId = thread.id;
                    console.log('Found thread ID:', threadId, 'isResolved:', thread.isResolved);
                    break;
                  }
                }
                
                if (threadId) {
                  // Resolve the thread using GraphQL mutation
                  const mutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: {threadId: $threadId}) {
                        thread {
                          id
                          isResolved
                        }
                      }
                    }
                  `;
                  
                  const resolveResult = await github.graphql(mutation, { threadId });
                  console.log('Thread resolved successfully:', resolveResult.resolveReviewThread.thread.isResolved);
                } else {
                  console.log('Could not find thread ID for comment', commentId);
                }
              } catch (error) {
                console.log('Could not resolve conversation thread:', error.message);
                console.log('Error details:', error);
                // Don't fail the workflow if we can't resolve the thread
              }
            }

      - name: Post error comment
        if: failure() && steps.check-command.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '❌ Failed to add term to Vale accept list. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
