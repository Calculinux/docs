name: Vale - Add Term to Accept List

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-to-accept-list:
    # Only run on PR comments (both issue comments and review comments)
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for vale-accept-term command
        id: check-command
        uses: actions/github-script@v7
        with:
          script: |
            // Determine event type and extract comment body
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            const comment = context.payload.comment.body.trim().toLowerCase();
            const validCommand = 'vale-accept-term';
            
            // Extract issue/PR number based on event type
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            core.setOutput('issue_number', issueNumber);
            
            // Check if comment is the valid command
            if (comment !== validCommand) {
              console.log('Comment is not the vale-accept-term command:', comment);
              return { shouldRun: false };
            }
            
            let comments;
            let currentCommentId = context.payload.comment.id;
            
            if (isReviewComment) {
              // For review comments, get the list of review comments
              const reviewComments = await github.rest.pulls.listReviewComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber
              });
              comments = reviewComments.data;
            } else {
              // For issue comments, get the list of issue comments
              const issueComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              comments = issueComments.data;
            }
            
            // Find the previous comment (Vale error)
            const currentIndex = comments.findIndex(c => c.id === currentCommentId);
            
            if (currentIndex <= 0) {
              console.log('No previous comment found');
              return { shouldRun: false };
            }
            
            const previousComment = comments[currentIndex - 1];
            
            // Check if it's a Vale error comment (from vale-action bot)
            if (!previousComment.body.includes('Vale') && !previousComment.body.includes('vale')) {
              console.log('Previous comment is not a Vale error');
              return { shouldRun: false };
            }
            
            // Extract term from Vale error message
            // Vale errors typically look like: "Did you really mean 'term'?"
            // or: "Unknown word: term"
            const termPatterns = [
              /'([^']+)'/,           // Single quotes
              /"([^"]+)"/,           // Double quotes
              /\*\*([^*]+)\*\*/,     // Bold markdown
              /`([^`]+)`/,           // Code backticks
              /Unknown word:\s*(\w+)/i,
              /Did you really mean\s+'([^']+)'/i
            ];
            
            let term = null;
            for (const pattern of termPatterns) {
              const match = previousComment.body.match(pattern);
              if (match) {
                term = match[1];
                break;
              }
            }
            
            if (!term) {
              console.log('Could not extract term from Vale error');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '❌ Could not extract term from the Vale error.\n\nPlease ensure you are replying to a Vale error comment with `vale-accept-term`.'
              });
              return { shouldRun: false };
            }
            
            console.log('Extracted term:', term);
            core.setOutput('term', term);
            core.setOutput('should_run', 'true');
            core.setOutput('is_review_comment', isReviewComment ? 'true' : 'false');
            return { shouldRun: true, term: term };

      - name: Get PR details
        if: steps.check-command.outputs.should_run == 'true' && steps.check-command.outputs.is_review_comment == 'true'
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber
            });
            core.setOutput('head_ref', pr.data.head.ref);
            return pr.data.head.ref;

      - name: Checkout PR branch
        if: steps.check-command.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.check-command.outputs.is_review_comment == 'true' && steps.pr-details.outputs.head_ref || github.event.issue.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add term to accept list
        if: steps.check-command.outputs.should_run == 'true'
        id: add-term
        run: |
          TERM="${{ steps.check-command.outputs.term }}"
          ACCEPT_FILE=".github/styles/config/vocabularies/Calculinux/accept.txt"
          
          if [ -z "$TERM" ]; then
            echo "No term to add"
            exit 1
          fi
          
          # Check if term already exists (case-insensitive)
          if grep -iq "^${TERM}$" "$ACCEPT_FILE"; then
            echo "term_exists=true" >> $GITHUB_OUTPUT
            echo "Term '$TERM' already exists in accept list"
          else
            # Add term to the end of the file (before any trailing newlines)
            # Remove trailing newlines, add term, add back one newline
            sed -i -e :a -e '/^\s*$/d;N;ba' "$ACCEPT_FILE"
            echo "$TERM" >> "$ACCEPT_FILE"
            echo "term_exists=false" >> $GITHUB_OUTPUT
            echo "Added term '$TERM' to accept list"
          fi

      - name: Commit and push changes
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists != 'true'
        run: |
          TERM="${{ steps.check-command.outputs.term }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .github/styles/config/vocabularies/Calculinux/accept.txt
          git commit -m "docs: add '$TERM' to Vale accept list
          
          Added via PR comment command.
          Co-authored-by: ${{ github.event.comment.user.login }} <${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com>"
          
          git push

      - name: Post success comment
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const term = '${{ steps.check-command.outputs.term }}';
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            
            // Post success comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Added \`${term}\` to the Vale accept list!\n\nThe term has been committed to this PR. Vale will no longer flag this word as an error.`
            });
            
            // Add green checkmark reaction to the command comment
            if (isReviewComment) {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            }
            
            // Try to resolve the review thread if this was a review comment
            if (isReviewComment) {
              try {
                // Get all review comments
                const reviewComments = await github.rest.pulls.listReviewComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber
                });
                
                // Find the current comment to get the previous one (the Vale error)
                const currentIndex = reviewComments.data.findIndex(c => c.id === context.payload.comment.id);
                if (currentIndex > 0) {
                  const previousComment = reviewComments.data[currentIndex - 1];
                  
                  // Check if this is the Vale error comment
                  if (previousComment.body.toLowerCase().includes('vale') || 
                      previousComment.body.includes(term)) {
                    // Update the comment to mark it as resolved
                    await github.rest.pulls.updateReviewComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: previousComment.id,
                      body: previousComment.body + '\n\n✅ **Resolved**: Term added to accept list via `vale-accept-term` command.'
                    });
                    
                    console.log('Resolved review thread for comment', previousComment.id);
                  }
                }
              } catch (error) {
                console.log('Could not resolve conversation thread:', error.message);
                // Don't fail the workflow if we can't resolve the thread
              }
            }

      - name: Post already exists comment
        if: steps.check-command.outputs.should_run == 'true' && steps.add-term.outputs.term_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const term = '${{ steps.check-command.outputs.term }}';
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            const isReviewComment = context.eventName === 'pull_request_review_comment';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `ℹ️ The term \`${term}\` already exists in the Vale accept list.`
            });
            
            // Add reaction to the command comment
            if (isReviewComment) {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            }

      - name: Post error comment
        if: failure() && steps.check-command.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.check-command.outputs.issue_number }}', 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '❌ Failed to add term to Vale accept list. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
